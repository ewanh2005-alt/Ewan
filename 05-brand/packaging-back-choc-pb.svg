      <h4>Nutrition</h4>
      <table><thead><tr><th>Typical values</th><th>Per 100 g</th><th>Per bar (approx. 106 g)</th><th>%RI*</th></tr></thead><tbody><tr><td>Energy</td><td>1115 kJ<br/>265 kcal</td><td>1186 kJ<br/>282 kcal</td><td>14%</td></tr><tr><td>Fat</td><td>7.5 g</td><td>8.0 g</td><td>11%</td></tr><tr><td class="sub">of which saturates</td><td>1.7 g</td><td>1.8 g</td><td>9%</td></tr><tr><td>Carbohydrate</td><td>26 g</td><td>28 g</td><td>11%</td></tr><tr><td class="sub">of which sugars</td><td>7.4 g</td><td>7.9 g</td><td>9%</td></tr><tr><td>Fibre</td><td>6.7 g</td><td>7.1 g</td><td></td></tr><tr><td>Protein</td><td>20 g</td><td>21 g</td><td>42%</td></tr><tr><td>Salt</td><td>0.47 g</td><td>0.50 g</td><td>8%</td></tr></tbody></table>
      <p class="small" style="margin-top:4px">*Reference intake of an average adult (8400 kJ / 2000 kcal). Concept pack: values calculated from the recipe; bar weight and per-100 g values estimated until test bakes are weighed. To be confirmed by lab analysis before sale.</p>
