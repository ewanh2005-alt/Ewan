      <h4>Nutrition</h4>
      <table><thead><tr><th>Typical values</th><th>Per 100 g</th><th>Per bar (90 g)</th><th>%RI*</th></tr></thead><tbody><tr><td>Energy</td><td>1251 kJ<br/>299 kcal</td><td>1126 kJ<br/>269 kcal</td><td>13%</td></tr><tr><td>Fat</td><td>12 g</td><td>11 g</td><td>16%</td></tr><tr><td class="sub">of which saturates</td><td>2.9 g</td><td>2.6 g</td><td>13%</td></tr><tr><td>Carbohydrate</td><td>25 g</td><td>23 g</td><td>9%</td></tr><tr><td class="sub">of which sugars</td><td>2.1 g</td><td>1.9 g</td><td>2%</td></tr><tr><td>Fibre</td><td>6.5 g</td><td>5.8 g</td><td></td></tr><tr><td>Protein</td><td>19 g</td><td>17 g</td><td>33%</td></tr><tr><td>Salt</td><td>0.44 g</td><td>0.40 g</td><td>7%</td></tr></tbody></table>
      <p class="small" style="margin-top:4px">*Reference intake of an average adult (8400 kJ / 2000 kcal). Values calculated; to be confirmed by lab analysis before sale.</p>
