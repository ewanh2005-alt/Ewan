      <h4>Nutrition</h4>
      <table><thead><tr><th>Typical values</th><th>Per 100 g</th><th>Per bar (80 g)</th><th>%RI*</th></tr></thead><tbody><tr><td>Energy</td><td>1552 kJ<br/>368 kcal</td><td>1242 kJ<br/>295 kcal</td><td>15%</td></tr><tr><td>Fat</td><td>7.9 g</td><td>6.4 g</td><td>9%</td></tr><tr><td class="sub">of which saturates</td><td>1.7 g</td><td>1.4 g</td><td>7%</td></tr><tr><td>Carbohydrate</td><td>46 g</td><td>37 g</td><td>14%</td></tr><tr><td class="sub">of which sugars</td><td>29 g</td><td>23 g</td><td>26%</td></tr><tr><td>Fibre</td><td>6.5 g</td><td>5.2 g</td><td></td></tr><tr><td>Protein</td><td>25 g</td><td>20 g</td><td>39%</td></tr><tr><td>Salt</td><td>0.69 g</td><td>0.56 g</td><td>9%</td></tr></tbody></table>
      <p class="small" style="margin-top:4px">*Reference intake of an average adult (8400 kJ / 2000 kcal). Values calculated; to be confirmed by lab analysis before sale.</p>
