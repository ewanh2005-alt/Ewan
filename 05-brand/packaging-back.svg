      <h4>Cocoa &amp; Peanut bar</h4>
      <p><b>Ingredients:</b> Free-range <b>eggs</b>, <b>oats</b>, banana, <b>peanut</b> butter (8%), <b>peanuts</b> (6%), semi-skimmed <b>milk</b>, cocoa powder (2%).</p>
      <p><b>Allergy advice:</b> for allergens, including cereals containing gluten, see ingredients in <b>bold</b>. Made in a kitchen that also handles <b>almonds</b>. <span class="ph">[confirm after allergen risk assessment]</span></p>
      <h4>How to eat it</h4>
      <p>For after training, when a proper meal is still a way off. Not designed for eating before or during exercise.</p>
      <p><b>Low sugar. Source of protein.</b> Protein contributes to a growth in muscle mass. Enjoy as part of a varied, balanced diet and a healthy lifestyle.</p>
      <p class="small"><b>Keep refrigerated (0–5 °C).</b> Use by: <span class="ph">[date]</span>. Suitable for home freezing: freeze on day of purchase, defrost in the fridge · Lot: <span class="ph">[lot]</span><br/><span class="ph">[Business name, UK address]</span> · Made in <span class="ph">[Durham]</span>, UK · <span class="ph">[recycling info]</span></p>
    </div>
  </foreignObject>
  <foreignObject x="400" y="20" width="326" height="290">
    <div xmlns="http://www.w3.org/1999/xhtml"><style>*{margin:0;box-sizing:border-box} div{font-family:Archivo, Inter, 'Helvetica Neue', Arial, sans-serif;color:#1C1B19;font-size:10.5px;line-height:1.35} h4{font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin:0 0 3px;color:#1C1B19} p{margin:0 0 7px} table{border-collapse:collapse;width:100%;font-size:10px} th,td{border-bottom:1px solid #1C1B19;padding:2px 4px;text-align:right;vertical-align:top} th:first-child,td:first-child{text-align:left} th{border-bottom:2px solid #1C1B19} td.sub{padding-left:12px} .ph{background:#fff3c4;padding:0 3px;border-radius:2px} .small{font-size:9px;color:#5E5A52}</style>
      <h4>Nutrition</h4>
      <table><thead><tr><th>Typical values</th><th>Per 100 g</th><th>Per bar (90 g)</th><th>%RI*</th></tr></thead><tbody><tr><td>Energy</td><td>1489 kJ<br/>356 kcal</td><td>1340 kJ<br/>321 kcal</td><td>16%</td></tr><tr><td>Fat</td><td>17 g</td><td>16 g</td><td>22%</td></tr><tr><td class="sub">of which saturates</td><td>3.9 g</td><td>3.5 g</td><td>17%</td></tr><tr><td>Carbohydrate</td><td>31 g</td><td>28 g</td><td>11%</td></tr><tr><td class="sub">of which sugars</td><td>3.8 g</td><td>3.4 g</td><td>4%</td></tr><tr><td>Fibre</td><td>6.5 g</td><td>5.8 g</td><td></td></tr><tr><td>Protein</td><td>16 g</td><td>14 g</td><td>29%</td></tr><tr><td>Salt</td><td>0.18 g</td><td>0.16 g</td><td>3%</td></tr></tbody></table>
      <p class="small" style="margin-top:4px">*Reference intake of an average adult (8400 kJ / 2000 kcal). Values calculated; to be confirmed by lab analysis before sale.</p>
